<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="./viewdetails.css">
</head>
<body>
    <form action="./order.html">
    <div class="product-details">
        <div class="product-image">
            <img src="./39.jpg" alt="Women's Comfortable dress">
        </div>
        <div class="product-info">
            <h1>Casaliving Rolando 4 Seater Right Hand Side L Shape Sofa Set for Living Room with 2 Puffy - (Blue Grey Fabric) Premium Fabric Sofa Set</h1>
            <p class="ratings">
                <span> 3.9 | 9,051 Ratings</span> <span class="assured">Assured</span>
            </p>
            <p class="price">
                <span class="original-price"><del>RS 38,999/-</del></span>
                <span class="discount-price">RS 15,499/-</span>
                <span class="discount-percent">(60% OFF)</span>
            </p>
            <p class="delivery">
                <strong>Free delivery</strong> by <span>26th March</span>
            </p>
           
            <div class="delivery-address">
                <p><strong>Deliver to:</strong>Kavya</p>
                <p></p>
            </div>
            <form action="./order.html">
            <div class="action-buttons">
                <button class="add-to-cart">Add to Cart</button>
                <button class="buy-now">Buy Now</button>
            </div>
        </div>
    </div>
    </form>
</body>
</html>

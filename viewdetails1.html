<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="./viewdetails.css">
</head>
<body>
    <form action="./order.html">
    <div class="product-details">
        <div class="product-image">
            <img src="./kid11.jpeg" alt="Women's Comfortable dress">
        </div>
        <div class="product-info">
            <h1>Froks</h1>
            <p class="ratings">
                <span> 3.9 | 9,051 Ratings</span> <span class="assured">Assured</span>
            </p>
            <p class="price">
                <span class="original-price"><del>RS 1000/-</del></span>
                <span class="discount-price">RS 500</span>
                <span class="discount-percent">(18% OFF)</span>
            </p>
            <p class="delivery">
                <strong>Free delivery</strong> by <span>26th March</span>
            </p>
            <p>Available Colors:</p>
            <div class="color-options">
                <div class="color-box" style="background-color: grey;"></div>
                <div class="color-box" style="background-color: lightblue;"></div>
                <div class="color-box" style="background-color: black;"></div>
                <div class="color-box" style="background-color: navy;"></div>
            </div>
            <p>Size:</p>
            <label for="size"></label>
                    <input type="radio" name="size" id="XS" value="XS" required>XS
                    <input type="radio" name="size" id="S" value="S" required>S
                    <input type="radio" name="size" id="M" value="M" required>M
                    <input type="radio" name="size" id="L" value="L" required>L
                    <input type="radio" name="size" id="XL" value="XL" required>XL
                    <input type="radio" name="size" id="XXL" value="XXL" required>XXL<BR><BR>
            <div class="delivery-address">
                <p><strong>Deliver to:</strong>Kavya</p>
                <p>3-54, Munduru, Eluru, Andhra Pradesh, 534452</p>
            </div>
            <form action="./order.html">
            <div class="action-buttons">
                <button class="add-to-cart">Add to Cart</button>
                <button class="buy-now">Buy Now</button>
            </div>
        </div>
    </div>
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contactus.css">
</head>
<body>

    <header class="page-header">
        <div class="header-left">
        <img src="./logo1.jpg" alt="Logo" class="logo">
         </div>
         <h1 class="page-title">Contact Us</h1>
       
    </header>

  <div class="contact-container">
    <section class="contact-section">
      <h2>Get in Touch</h2>
      <p>We'd love to hear from you! Please fill out the form below or use the contact information provided.</p>

      <form class="contact-form">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message</button>
      </form>
    </section>

    <section class="contact-info-section">
      <h2>Contact Information</h2>
      <ul class="contact-info-list">
        <li><strong>Address:</strong> 123 RR Pet, Eluru, Andhra Pradesh, India</li>
        <li><strong>Phone:</strong> +91 9876543210</li>
        <li><strong>Email:</strong> aelina@yourwebsite.com</li>
      </ul>
    </section>
  </div>

  <script src="./script.js"></script>
</body>
</html>

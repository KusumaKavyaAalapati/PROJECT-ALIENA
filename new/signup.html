<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="form-container">
        <h2>SIGN UP</h2>
        <form id="signup-form">
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName" placeholder="Eg. Jayanthi" required>

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName" placeholder="Eg. Vaituri" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Eg. jayanthi@gmail.com" required>

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <div class="radio-group">
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female" required> Female</label>
                <label><input type="radio" name="gender" value="others" required> Others</label>
            </div>

            <div class="checkbox-group">
                <label><input type="checkbox" name="language" value="telugu"> Telugu</label>
                <label><input type="checkbox" name="language" value="english"> English</label>
                <label><input type="checkbox" name="language" value="hindi"> Hindi</label>
            </div>

            <label for="phone">Phone No:</label>
            <input type="text" id="phone" name="phone" placeholder="Eg. 1234567890" required>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script src="signup.js"></script>
</body>
</html>
